name: Update Homebrew cask

# Runs when a maintainer publishes a release. Requires the HOMEBREW_TAP_TOKEN secret: a fine-grained token
# with "Contents: read and write" on the tap repository (default: <owner>/homebrew-tap).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || format('{0}/homebrew-tap', github.repository_owner) }}
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update cask
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "Beamly-$VERSION.dmg" --dir "$RUNNER_TEMP"
          SHA256="$(sha256sum "$RUNNER_TEMP/Beamly-$VERSION.dmg" | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/beamly.rb.template \
            > "$RUNNER_TEMP/tap/Casks/beamly.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/beamly.rb
          git commit -m "beamly $VERSION"
          git push
