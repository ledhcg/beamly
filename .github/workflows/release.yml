name: Release

# Pushing a tag vX.Y.Z (matching the VERSION file) builds signed artifacts and creates a DRAFT
# GitHub release. A maintainer reviews the draft and publishes it. See docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          VERSION="$(cat VERSION)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($VERSION)"
            exit 1
          fi
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Unit tests
        run: swift test --package-path macos

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build universal app and CLI
        env:
          UNIVERSAL: "1"
        run: |
          export SIGN_IDENTITY="${MACOS_SIGN_IDENTITY:--}"
          [ "$SIGN_IDENTITY" = "-" ] && echo "::warning::No Developer ID certificate configured; building an ad-hoc signed, unnotarized app."
          macos/Scripts/bundle-app.sh dist

      - name: Package
        run: |
          hdiutil create -volname Beamly -srcfolder dist/Beamly.app -ov -format UDZO "dist/Beamly-$VERSION.dmg"
          [ -z "$MACOS_SIGN_IDENTITY" ] || codesign --force --sign "$MACOS_SIGN_IDENTITY" --timestamp "dist/Beamly-$VERSION.dmg"
          ditto -c -k dist/beamly "dist/beamly-cli-$VERSION-macos.zip"

      - name: Notarize and staple
        if: env.MACOS_SIGN_IDENTITY != '' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          for file in "dist/Beamly-$VERSION.dmg" "dist/beamly-cli-$VERSION-macos.zip"; do
            xcrun notarytool submit "$file" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          done
          xcrun stapler staple "dist/Beamly-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/Beamly-$VERSION.dmg"
          rm "$KEY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Configure release signing
        id: signing
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # A random CI debug key would make the APK impossible to upgrade later, so do not ship one.
            echo "::warning::No Android release keystore configured; the release will not include an APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Test and build
        working-directory: android
        run: ./gradlew spotlessCheck check assembleRelease
      - name: Collect APK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/beamly-tv-$VERSION.apk"
      - name: Remove signing material
        if: always()
        run: rm -f android/release.jks android/keystore.properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: ignore

  publish:
    needs: [verify, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: http/ { next }
            found { print }
          ' CHANGELOG.md > notes.md
          printf '\n**Checksums:** see SHA256SUMS.txt\n' >> notes.md
      - name: Create draft release
        run: |
          gh release create "v$VERSION" dist/* --draft --verify-tag \
            --title "Beamly $VERSION" --notes-file notes.md
