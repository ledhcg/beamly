name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS sender
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Lint (swift-format)
        working-directory: macos
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Unit tests
        run: swift test --package-path macos
      - name: Build app bundle (ad-hoc signed)
        env:
          SIGN_IDENTITY: "-"
        run: macos/Scripts/bundle-app.sh build

  android:
    name: Android TV receiver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Format, unit tests, lint, build
        working-directory: android
        run: ./gradlew spotlessCheck check assembleDebug
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/

  protocol:
    name: Protocol test vectors are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 protocol/generate_test_vectors.py
      - run: git diff --exit-code protocol/test-vectors
